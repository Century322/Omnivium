version: '3.8'

services:
  synapse:
    image: matrixdotorg/synapse:v1.114.0
    container_name: omnivium-synapse
    restart: unless-stopped
    ports:
      - "8008:8008"
    volumes:
      - ./synapse-data:/data
    environment:
      - SYNAPSE_SERVER_NAME=localhost
      - SYNAPSE_REPORT_STATS=no
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - omnivium-net

  api-proxy:
    build:
      context: ./api-proxy
      dockerfile: Dockerfile
    container_name: omnivium-api-proxy
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      - PROXY_TOKEN=${PROXY_TOKEN:?PROXY_TOKEN must be set}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - KIMI_API_KEY=${KIMI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - ZHIPU_API_KEY=${ZHIPU_API_KEY:-}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY:-}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8787/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - omnivium-net

networks:
  omnivium-net:
    driver: bridge
